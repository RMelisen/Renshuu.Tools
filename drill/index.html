<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entraînement Dōshi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"></script>

<div class="app">
  <header class="bar">
    <h1 lang="ja">動詞ドリル</h1>
    <div class="bar-actions">
      <button type="button" class="quiet" id="cheatsheet-toggle" aria-expanded="false" aria-controls="cheatsheet">Aide-mémoire</button>
      <button type="button" class="quiet" id="settings-toggle" aria-expanded="false" aria-controls="settings">Réglages</button>
    </div>
  </header>

  <form id="settings" class="settings" hidden>
    <fieldset id="set-forms"><legend>Formes</legend></fieldset>
    <fieldset id="set-groups"><legend>Groupes de mots</legend></fieldset>
    <fieldset id="set-length"><legend>Cartes par manche</legend></fieldset>
    <div class="details">
      <fieldset id="set-details"><legend>Afficher sur les cartes</legend></fieldset>
      <p class="hint">Les changements s'appliquent tout de suite. Ce qui est masqué apparaît une fois ta réponse vérifiée.</p>
    </div>
    <p id="settings-error" class="pen" role="alert" hidden>Choisis au moins une forme et un groupe de mots qui vont ensemble.</p>
    <div class="actions"><button type="submit" class="solid" id="settings-start">Commencer une nouvelle manche</button></div>
  </form>

  <section id="cheatsheet" class="cheatsheet" hidden>
    <h2 id="cheatsheet-title" tabindex="-1">Aide-mémoire</h2>
    <div id="cheatsheet-groups" class="cheat-groups"></div>
  </section>

  <main id="cards">
    <p id="status">Chargement de tes mots…</p>

    <section id="drill" hidden>
      <div class="progress">
        <div id="strip" class="strip" aria-hidden="true"></div>
        <div class="progress-line">
          <p id="progress"></p>
          <div id="quick-details" class="quick" role="group" aria-label="Afficher sur la carte"></div>
        </div>
      </div>

      <div class="cue">
        <p id="verb-main" class="verb" lang="ja"></p>
        <div class="cue-line">
          <p id="verb-sub" class="reading" lang="ja"></p>
          <p id="verb-group" class="kind"></p>
        </div>
        <p id="verb-defs" class="defs" lang="fr"></p>
      </div>

      <form id="answer-form" autocomplete="off">
        <label for="answer" class="target">
          <span id="form-label"></span>
          <span id="form-ending" class="ending" lang="ja"></span>
          <span id="retry-tag" class="tag" hidden>Deuxième essai</span>
        </label>

        <div class="sheet">
          <div id="cells" class="cells" lang="ja" aria-hidden="true"></div>
          <svg id="mark" class="mark" aria-hidden="true" hidden><path id="mark-path" pathLength="1"></path></svg>
          <input id="answer" type="text" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
        </div>

        <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

        <div class="actions">
          <button type="submit" class="solid" id="primary">Vérifier</button>
          <button type="button" class="quiet" id="reveal">Voir la réponse</button>
        </div>
        <p id="hint" class="hint pen" hidden></p>
      </form>
    </section>

    <section id="summary" hidden>
      <h2 id="summary-title" tabindex="-1"></h2>
      <div id="summary-strip" class="strip" aria-hidden="true"></div>
      <h3 id="mistakes-title"></h3>
      <ul id="mistakes" class="mistakes"></ul>
      <div class="actions"><button type="button" class="solid" id="again">Commencer une autre manche</button></div>
    </section>
  </main>
</div>

<script type="module" src="app.js"></script>
