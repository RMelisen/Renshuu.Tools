<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dōshi Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"></script>

<div class="app">
  <header class="bar">
    <h1 lang="ja">動詞ドリル</h1>
    <button type="button" class="quiet" id="settings-toggle" aria-expanded="false" aria-controls="settings">Settings</button>
  </header>

  <form id="settings" class="settings" hidden>
    <fieldset id="set-forms"><legend>Forms</legend></fieldset>
    <fieldset id="set-groups"><legend>Verb groups</legend></fieldset>
    <fieldset id="set-length"><legend>Cards per round</legend></fieldset>
    <label class="check"><input type="checkbox" id="set-reading"> Show readings on verbs</label>
    <p id="settings-error" class="pen" role="alert" hidden>Choose at least one form and one verb group.</p>
    <div class="actions"><button type="submit" class="solid" id="settings-start">Start new round</button></div>
  </form>

  <main>
    <p id="status">Loading your verbs…</p>

    <section id="drill" hidden>
      <div class="progress">
        <div id="strip" class="strip" aria-hidden="true"></div>
        <p id="progress"></p>
      </div>

      <div class="cue">
        <p id="verb-main" class="verb" lang="ja"></p>
        <p id="verb-sub" class="reading" lang="ja"></p>
        <p id="verb-defs" class="defs" lang="fr"></p>
      </div>

      <form id="answer-form" autocomplete="off">
        <label for="answer" class="target">
          <span id="form-label"></span>
          <span id="form-ending" class="ending" lang="ja"></span>
          <span id="retry-tag" class="tag" hidden>Second try</span>
        </label>

        <div class="sheet">
          <div id="cells" class="cells" lang="ja" aria-hidden="true"></div>
          <svg id="mark" class="mark" aria-hidden="true" hidden><path id="mark-path" pathLength="1"></path></svg>
          <input id="answer" type="text" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
        </div>

        <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

        <div class="actions">
          <button type="submit" class="solid" id="primary">Check</button>
          <button type="button" class="quiet" id="reveal">Show answer</button>
        </div>
        <p id="hint" class="hint"></p>
      </form>
    </section>

    <section id="summary" hidden>
      <h2 id="summary-title" tabindex="-1"></h2>
      <div id="summary-strip" class="strip" aria-hidden="true"></div>
      <h3 id="mistakes-title"></h3>
      <ul id="mistakes" class="mistakes"></ul>
      <div class="actions"><button type="button" class="solid" id="again">Start another round</button></div>
    </section>
  </main>
</div>

<script type="module" src="app.js"></script>
